<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Диагностика экрана</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0e0e10; color: #f2f0eb; font: 15px/1.45 system-ui, sans-serif; }
  /* полосы по краям безопасной зоны: видно, где браузер считает «безопасно» */
  .safe-top { position: fixed; left: 0; right: 0; top: 0; height: env(safe-area-inset-top); background: rgba(255, 91, 46, .5); z-index: 5; }
  .bar { position: fixed; left: 0; right: 0; top: 0; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top)); background: #2fbf71; color: #0e0e10; font-weight: 700; z-index: 4; }
  .bar::before { content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: 200px; background: #3b3bff; }
  main { padding: 160px 16px 60px; }
  h1 { font-size: 20px; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
  td { padding: 6px 4px; border-bottom: 1px solid #333; vertical-align: top; word-break: break-all; }
  td:first-child { color: #8a8780; width: 45%; word-break: normal; }
  .filler { height: 1500px; background: repeating-linear-gradient(#1a1a1d 0 60px, #26262b 60px 120px); border-radius: 12px; display: grid; place-items: start center; padding-top: 20px; color: #8a8780; }
  #probe { position: fixed; top: env(safe-area-inset-top); left: 0; width: 1px; height: 1px; }
</style>
</head>
<body>
<div class="safe-top"></div>
<div class="bar">Зелёная полоса = шапка сайта (синяя — фон над ней)</div>
<div id="probe"></div>
<main>
  <h1>Пришлите скриншот этой страницы</h1>
  <table id="t"></table>
  <div class="filler">Полистайте вниз и сделайте второй скриншот</div>
</main>
<script>
  const rows = [];
  const add = (k, v) => rows.push(`<tr><td>${k}</td><td>${v}</td></tr>`);
  const probe = document.getElementById('probe');
  function render() {
    rows.length = 0;
    const vv = window.visualViewport;
    add('safe-area-inset-top', getComputedStyle(probe).top);
    add('Ширина × высота окна', `${innerWidth} × ${innerHeight}`);
    add('Высота экрана', `${screen.width} × ${screen.height}`);
    add('visualViewport', vv ? `${Math.round(vv.width)} × ${Math.round(vv.height)}, сдвиг ${Math.round(vv.offsetTop)}` : 'нет');
    add('Прокрутка', Math.round(scrollY));
    add('Шапка (зелёная) сверху', Math.round(document.querySelector('.bar').getBoundingClientRect().top) + ' px');
    add('TelegramWebviewProxy', typeof window.TelegramWebviewProxy !== 'undefined' ? 'есть' : 'нет');
    add('TelegramWebview', typeof window.TelegramWebview !== 'undefined' ? 'есть' : 'нет');
    add('Telegram (WebApp)', window.Telegram ? 'есть' : 'нет');
    add('User-Agent', navigator.userAgent);
    document.getElementById('t').innerHTML = rows.join('');
  }
  render();
  addEventListener('scroll', render, { passive: true });
  addEventListener('resize', render);
</script>
</body>
</html>
